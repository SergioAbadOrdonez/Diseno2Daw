<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destinos Populares</title>
    <link rel="stylesheet" href="src/style.css" />
    <meta name="author" content="Sergio" />
  </head>
  <body class="contrast-more:contrast-110 dark:bg-slate-900 bg-gray-50">
    <header>
      <h1 class="font-bold text-center text-4xl p-6 dark:text-indigo-400">Destinos Populares</h1>
    </header>
    
    <main class="mx-auto p-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-w-7xl">
        
        <div class="mb-4 rounded-xl shadow-lg overflow-hidden h-110 transition-all duration-300 bg-slate-50 hover:scale-105 hover:shadow-slate-700 dark:border dark:border-gray-100 dark:bg-slate-800">
          <img
            class="object-cover h-60 w-full"
            src="https://thumbs.dreamstime.com/z/paisaje-de-la-monta%C3%B1a-con-un-lago-glacial-y-los-pinos-28435203.jpg?ct=jpeg"
            alt="Paisaje de montaña"
          />
          <div class="border-t py-4 px-6 border-gray-400 dark:border-gray-300">
            <h2 class="font-bold text-2xl text-indigo-600 dark:text-indigo-400">Montañas majestuosas</h2>
            <p class="text-base h-16 max-w-110 text-gray-600 dark:text-gray-100">Explora paisajes impresionantes y respira aire puro.</p>
            <a href="#" class="mt-2 inline-block rounded-lg py-2 px-4 text-white bg-indigo-500 hover:bg-indigo-600">Ver más</a>
          </div>
        </div>

        <div class="mb-4 rounded-xl shadow-lg overflow-hidden h-110 transition-all duration-300 bg-slate-50 hover:scale-105 hover:shadow-slate-700 dark:bg-slate-800">
          <img
            class="object-cover h-60 w-full"
            src="https://plus.unsplash.com/premium_photo-1723867356920-8e05009f3499?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1241"
            alt="Playa tropical"
          />
          <div class="border-t py-4 px-6 border-gray-400 dark:border-gray-300">
            <h2 class="font-bold text-2xl text-indigo-600 dark:text-indigo-400">Playas paradisíacas</h2>
            <p class="text-base h-16 max-w-110 text-gray-600 dark:text-gray-100">Relájate en la arena blanca y disfruta del sol.</p>
            <a href="#" class="mt-2 inline-block rounded-lg py-2 px-4 text-white bg-indigo-500 hover:bg-indigo-600">Ver más</a>
          </div>
        </div>

        <div class="mb-4 rounded-xl shadow-lg overflow-hidden h-110 transition-all duration-300 bg-slate-50 hover:scale-105 hover:shadow-slate-700 dark:border dark:border-gray-100 dark:bg-slate-800">
          <img
            class="object-cover h-60 w-full"
            src="https://foto321.com/wp-content/uploads/2023/08/Pasaric-citiscape-a-contraluz-1536x1024.jpg"
            alt="Ciudad moderna de noche"
          />
          <div class="border-t py-4 px-6 border-gray-400 dark:border-gray-300">
            <h2 class="font-bold text-2xl text-indigo-600 dark:text-indigo-400">Ciudades vibrantes</h2>
            <p class="text-base h-16 max-w-110 text-gray-600 dark:text-gray-100">Descubre la vida nocturna y la cultura urbana.</p>
            <a href="#" class="mt-2 inline-block rounded-lg py-2 px-4 text-white bg-indigo-500 hover:bg-indigo-600">Ver más</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
